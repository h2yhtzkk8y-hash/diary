<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cloth:#26303d;      /* 藍の布 */
  --cloth-ink:#d9dde3;  /* 布の上の文字 */
  --cloth-sub:#8d97a5;
  --paper:#fbfaf6;
  --ink:#22252a;
  --sub:#8a8f97;
  --rule:#dfe3e8;
  --thread:#b89a5e;     /* 栞の色 */
  --danger:#c15c5c;
}
@media (prefers-color-scheme: dark){
  :root{
    --cloth:#181e27;
    --paper:#e9e7e1;
    --rule:#cfd3d8;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--cloth);
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px);
  color:var(--cloth-ink);
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
input,textarea,select,button{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:6px 4px}
:focus-visible{outline:2px solid var(--thread);outline-offset:3px}
.view{display:none}
.view.show{display:block}

/* ---------- 一覧 ---------- */
.shelf{max-width:960px;margin:0 auto;padding:40px 20px 96px}
.head{display:flex;align-items:flex-end;gap:22px;margin-bottom:32px;flex-wrap:wrap}
.head h1{
  margin:0 8px 0 0;font-size:0;line-height:0;padding-left:6px;flex-shrink:0;
  border-left:2px solid var(--thread);
}
/* 表紙と同じ手書きの題字 */
.head h1 svg{height:6.4rem;width:auto;display:block;overflow:visible}
.head h1 path{fill:var(--cloth-ink);stroke:var(--cloth-ink);stroke-width:.35;stroke-linejoin:round}
.tab{color:var(--cloth-ink);border-bottom:1px solid var(--cloth-sub);padding:6px 2px;font-size:1rem;letter-spacing:.1em}
.tab[aria-expanded="true"],.tab[aria-pressed="true"]{color:var(--thread);border-color:var(--thread)}
.search{
  min-width:140px;max-width:200px;background:transparent;border:none;
  border-bottom:1px solid var(--cloth-sub);padding:4px 2px;color:var(--cloth-ink);outline:none;margin-left:8px
}
.search::placeholder{color:var(--cloth-sub)}
.trace-panel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-12px 0 28px}
.trace-panel[hidden]{display:none}
.trace-panel select{
  background:transparent;border:none;border-bottom:1px solid var(--cloth-sub);
  color:var(--cloth-ink);padding:4px 2px;min-width:3.5em
}
.trace-panel select option{color:#000}
.trace-panel select:disabled{opacity:.35}
.trace-panel span{margin-right:6px}
.trace-panel button{color:var(--cloth-sub)}
.trace-panel button:hover{color:var(--cloth-ink)}

/* 頁の並び */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 22px}
.page{
  aspect-ratio:3/4;align-self:start;background:var(--paper);color:var(--ink);
  border-radius:1px 3px 3px 1px;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.28);
  transition:transform .18s ease, box-shadow .18s ease;
  display:flex;flex-direction:column;
}
.page:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 22px rgba(0,0,0,.32)}
/* 日記帳の頁：上に日付欄、下に縦罫 */
.page .hd{
  padding:10px 12px 6px;font-size:11px;color:var(--sub);letter-spacing:.08em;
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:3px double var(--rule);
}
.page .cols{
  flex:1;min-height:0;margin:10px 12px 12px;overflow:hidden;writing-mode:vertical-rl;
  background:repeating-linear-gradient(to left, transparent 0 21px, var(--rule) 21px 22px);
  -webkit-mask-image:linear-gradient(to left, #000 75%, transparent);
          mask-image:linear-gradient(to left, #000 75%, transparent);
}
.page .ttl{font-weight:600;font-size:14px;line-height:22px}
.page .ex{font-size:12px;line-height:22px;color:#4a4e55}
.page.sel{outline:3px solid var(--thread);outline-offset:4px}
/* 白紙：開いたら画面いっぱいに出る一枚 */
/* 見開き：左が無地（手で書く）、右が罫線（文字で書く） */
.spread{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 auto 56px;
  width:min(100%, calc(80vh * 3 / 2 + 6px));
}
.page.blank{display:block;width:100%;aspect-ratio:3/4}
.page.blank.lined{
  background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-position:0 56px;background-size:100% calc(100% - 88px);background-repeat:no-repeat;
}
.page.blank.lined::after{
  content:"";position:absolute;top:0;right:12%;width:12px;height:42%;
  background:var(--thread);
}

/* 目次 */
.toc{
  background:var(--paper);color:var(--ink);border-radius:2px;
  box-shadow:0 1px 0 rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
  padding:36px 44px;max-width:720px;
}
.toc h2{margin:0 0 20px;font-size:1.1rem;font-weight:600;letter-spacing:.6em}
.row{display:flex;align-items:baseline;gap:10px;padding:9px 0;cursor:pointer;border-radius:2px}
.row:hover .rt{text-decoration:underline;text-underline-offset:4px}
.row .rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.row .lead{flex:1;border-bottom:1px dotted var(--sub);transform:translateY(-4px);min-width:20px}
.row .rd{color:var(--sub);font-size:.85rem;white-space:nowrap}
.row.sel .rt{color:var(--thread);font-weight:600}
.row.sel .rt::before{content:"✓ "}
.toc .none{color:var(--sub)}

.none{grid-column:1/-1;color:var(--cloth-sub);padding:12px 0}
/* 月・年のまとまり */
.groups{display:flex;flex-direction:column;gap:6px}
.ghead{
  display:flex;align-items:baseline;gap:14px;width:100%;text-align:left;color:var(--cloth-ink);
  border-bottom:1px solid rgba(141,151,165,.35);padding:12px 2px;font-size:1.05rem;letter-spacing:.25em
}
.ghead .n{font-size:.75rem;color:var(--cloth-sub);letter-spacing:.05em}
.ghead .arrow{margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--cloth-sub);
  border-bottom:1.5px solid var(--cloth-sub);transform:rotate(-45deg);transition:transform .2s}
.ghead[aria-expanded="true"] .arrow{transform:rotate(45deg)}
.group.month > .pages{padding:18px 0 22px}
/* 前の年は一冊の束として */
.ghead.yh{border:none;border-left:3px solid var(--thread);background:rgba(255,255,255,.035);
  padding:16px 14px;font-size:1.15rem}
.year .ybody{padding-left:14px;border-left:1px solid rgba(184,154,94,.35);margin-left:1px}
/* 手書きの頁の縮小図 */
.page .inkthumb{flex:1;min-height:0;margin:6px 10px 10px;display:block}
.page .inkthumb svg{width:100%;height:100%;display:block}
.page .inkthumb path{fill:none;stroke:#22252a;stroke-linecap:round;stroke-linejoin:round}
.page .hd .t{color:var(--ink);font-weight:600;margin-left:8px}
.foot{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:48px;font-size:.85rem}
.foot button{color:var(--cloth-sub)}
.foot button:hover{color:var(--cloth-ink)}
.foot .bind{color:var(--thread)}
.bind-status{width:100%;text-align:center;color:var(--cloth-sub);font-size:.78rem}
/* 配布所（GitHub Pages で開いたとき） */
.dist{max-width:520px;margin:10vh auto 0;text-align:center;line-height:2}
.dist p{color:var(--cloth-sub);font-size:.9rem;margin:0 0 24px}
.dist button{color:var(--thread);font-size:1.1rem;border-bottom:1px solid var(--thread);padding:8px 4px}
/* 奥付 */
.colophon{
  width:100%;text-align:center;color:var(--cloth-sub);font-size:.72rem;letter-spacing:.35em;
  margin-top:28px;padding-top:14px;border-top:1px solid rgba(141,151,165,.35);
  max-width:260px;margin-left:auto;margin-right:auto
}

/* 選択中のバー */
.selbar{
  position:fixed;left:0;right:0;bottom:0;display:flex;gap:16px;align-items:center;justify-content:center;
  flex-wrap:wrap;padding:12px 16px;background:var(--cloth);border-top:2px solid var(--thread);font-size:.9rem
}
.selbar[hidden]{display:none}
.selbar .go{color:var(--thread);font-weight:600}

/* ---------- 書く ---------- */
.desk{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;font-size:.9rem}
.bar button{color:var(--cloth-ink)}
.bar .del{color:var(--danger)}
.bar input[type=date]{
  background:transparent;border:none;border-bottom:1px solid var(--cloth-sub);
  color:var(--cloth-ink);padding:4px 2px;color-scheme:dark;
}
.spacer{flex:1}
.status{color:var(--cloth-sub);font-size:.8rem}
.sheet{
  background:var(--paper);color:var(--ink);border-radius:2px;
  box-shadow:0 1px 0 rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.35);
  padding:40px 48px 28px;min-height:calc(100vh - 120px);display:flex;flex-direction:column;
}
.sheet .when{color:var(--sub);font-size:.85rem;letter-spacing:.1em;margin-bottom:6px}
.title{
  font-size:1.45rem;font-weight:600;border:none;background:transparent;outline:none;
  padding:4px 0 10px;border-bottom:1px solid var(--ink);margin-bottom:8px;
}
.title::placeholder{color:#b9bdc3}
.body{
  flex:1;border:none;outline:none;resize:none;font-size:1.02rem;
  line-height:2.2em;padding:0;min-height:50vh;
  background:transparent repeating-linear-gradient(to bottom,
    transparent 0, transparent calc(2.2em - 1px), var(--rule) calc(2.2em - 1px), var(--rule) 2.2em);
  background-attachment:local;
}
.meta{color:var(--sub);font-size:.78rem;text-align:right;margin-top:14px}
#ink{display:none;width:100%;aspect-ratio:3/4;touch-action:none;cursor:crosshair;margin-top:4px}
.ink-only{display:none}
.is-ink .ink-only{display:inline-block}
.is-ink #ink{display:block}
/* 本文は欄の中でスクロールさせず、書いた分だけ紙を伸ばす */
.body{overflow:hidden;flex:none}
.is-ink .text-only{display:none}
/* 手書き中は文字の選択や長押しメニューを出さない */
.is-ink, .is-ink *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.is-ink input{-webkit-user-select:text;user-select:text}
/* 貼った写真 */
.photos{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
.photos:empty{display:none}
.photo{
  width:120px;aspect-ratio:1;object-fit:cover;background:#fff;padding:5px;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transform:rotate(-1.5deg)
}
.photo:nth-child(2n){transform:rotate(1.2deg)}
.page .pthumb{
  position:absolute;left:10px;bottom:10px;width:38%;aspect-ratio:1;object-fit:cover;
  background:#fff;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:rotate(-3deg);z-index:1
}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.92);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:16px}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:80vh;object-fit:contain;background:#fff;padding:6px}
.lightbox .row2{display:flex;gap:24px}
.lightbox button{color:var(--cloth-ink)}
.lightbox .del{color:var(--danger)}
.bar .tool[aria-pressed="true"]{color:var(--thread);text-decoration:underline;text-underline-offset:5px}

@media (max-width:600px){
  .shelf{padding:28px 16px 96px}
  .pages{grid-template-columns:repeat(2,1fr);gap:18px 14px}
  .spread{grid-template-columns:1fr;gap:22px}
  .spread .page.blank.lined{order:-1}   /* 縦に並ぶときは、文字の白紙を上・手書きの白紙を下に */
  .sheet{padding:28px 20px 20px}
  .toc{padding:24px 20px}
}
@media (prefers-reduced-motion:reduce){ .page{transition:none} }

/* ---------- 表紙（ファイルのサムネイル・プレビュー用。開くと消える） ---------- */
.cover{min-height:100vh;background:#2a221d;display:flex;align-items:center;justify-content:center;padding:4vh 0 8vh}
.book{
  position:relative;height:84vh;width:63vh;max-width:86vw;max-height:115vw;
  background:#6b4a33;border-radius:2px 4px 4px 2px;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px);
  box-shadow:0 2px 0 rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.45);
}
/* 題簽 */
.book .label{
  position:absolute;top:7%;left:9%;width:21%;height:56%;
  background:#fbfaf6;padding:6% 0;display:flex;justify-content:center;align-items:center;
  box-shadow:inset 0 0 0 4px #fbfaf6, inset 0 0 0 5px #3a2e26;
}
.book .label svg{width:88%;height:auto;max-height:100%;overflow:visible}
.book .label path{fill:#1c1714;stroke:#1c1714;stroke-width:.35;stroke-linejoin:round}
/* 綴じ糸（四つ目綴じ） */
.book .spine{position:absolute;top:0;bottom:0;right:8%;width:1px;background:#e6dcc6}
.book .stitch{position:absolute;right:0;width:8%;height:1px;background:#e6dcc6}
.book .stitch::after{
  content:"";position:absolute;left:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:#2a1d14;
}
/* 栞 */
.book .ribbon{position:absolute;bottom:-7%;right:32%;width:2.4%;height:11%;background:#8c2f2a}
</style>
</head>

<!-- 日記の中身。このファイルに綴じると、ここが書き換わる -->
<script type="application/json" id="diary-data">{"book": "", "savedAt": 0, "entries": [], "deleted": [], "photos": {}}</script>

<script>
/* 何も描画する前のページ全体を控えておく（ファイルに綴じるときの元） */
const PRISTINE = '<!doctype html>\n' + document.documentElement.outerHTML;
/* 版。直すたびに番号を一つ上げる。古い日記帳はこの番号で見分ける */
const DIARY_VERSION = 19;
const DIARY_VERSION_DATE = '2026-10-15';
/* 表紙はファイルの見た目用。ブラウザで開いたら外す */
/* 表紙の題字を一覧の見出しにも使う */
{
  const svg = document.querySelector('#cover .label svg').cloneNode(true);
  const h = document.getElementById('mainTitle');
  h.textContent = ''; h.appendChild(svg);
}
document.getElementById('cover').remove();

/* この日記帳だけの保存場所。ファイルごとに別の番号を持ち、他の日記帳の中身は読まない */
const FILEDATA = (() => {
  try { return JSON.parse(document.getElementById('diary-data').textContent) || {}; } catch(e){ return {}; }
})();
const BOOK = /^[a-z0-9]{8,40}$/.test(FILEDATA.book || '') ? FILEDATA.book : 'nobook';
const KEY = 'diary-book-' + BOOK;
const LEGACY_KEY = 'diary-entries-v1';   // 以前の版の保存場所（持ち主の日記帳だけが一度だけ引き継ぐ）
const VIEWKEY = 'diary-view';
let entries = [];
let currentId = null;
let saveTimer = null;
let view = 'pages';
let selecting = false;
const selected = new Set();
let shown = [];

const $ = id => document.getElementById(id);

/* ---------- 読み込み・保存 ---------- */
/* 破いた頁の番号。ファイルにもブラウザにも残し、どちらかに古い写しがあっても復活させない */
let torn = new Set();
/* 写真は {id: {src, w, h}} でまとめて持ち、頁には番号だけ書く */
let photos = {};
function readState(raw){
  if(!raw) return null;
  if(Array.isArray(raw)) return {savedAt:0, entries:raw, deleted:[]};
  if(Array.isArray(raw.entries)) return {savedAt:raw.savedAt||0, entries:raw.entries,
    deleted: Array.isArray(raw.deleted) ? raw.deleted : []};
  return null;
}
function load(){
  let fromFile = null, fromLocal = null;
  let fromLegacy = null;
  fromFile = readState(FILEDATA);
  try { fromLocal = readState(JSON.parse(localStorage.getItem(KEY))); } catch(e){}
  if(FILEDATA.legacy){
    try { fromLegacy = readState(JSON.parse(localStorage.getItem(LEGACY_KEY))); } catch(e){}
  }
  // ファイルとブラウザの両方の頁を合わせる。同じ頁なら新しく書き直した方
  const byId = new Map();
  for(const st of [fromFile, fromLocal, fromLegacy]){
    if(!st) continue;
    for(const e of st.entries){
      if(!e || !e.id) continue;
      const old = byId.get(e.id);
      if(!old || (e.updated||0) >= (old.updated||0)) byId.set(e.id, e);
    }
  }
  for(const st of [fromFile, fromLocal, fromLegacy]) if(st) st.deleted.forEach(id => torn.add(id));
  if(FILEDATA.photos && typeof FILEDATA.photos === 'object') Object.assign(photos, FILEDATA.photos);
  entries = [...byId.values()].filter(e => !torn.has(e.id));
  // 何も書かれていない頁は捨てる
  entries = entries.filter(e => e && e.id && hasContent(e));
  try { view = localStorage.getItem(VIEWKEY) === 'toc' ? 'toc' : 'pages'; } catch(e){}
  // 引き継いだら、古い共通の保存場所は消す（他のファイルから見えないように）
  if(fromLegacy){
    try {
      localStorage.setItem(KEY, JSON.stringify({book:BOOK, savedAt:Date.now(), entries, deleted:[...torn]}));
      localStorage.removeItem(LEGACY_KEY);
    } catch(e){}
  }
}
function persist(){
  const state = {book:BOOK, savedAt:Date.now(), entries, deleted:[...torn]};
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    setStatus('保存済み');
  } catch(e){
    setStatus('ブラウザに保存できない');
  }
  savePhotos();
  writeFile(state);
}
function setStatus(s){ $('status').textContent = s; }
function hasContent(e){
  return (e.title||'').trim() || (e.body||'').trim() || (e.strokes && e.strokes.length)
    || (e.photos && e.photos.length);
}
/* 使われている写真だけ */
function usedPhotos(list = entries){
  const out = {};
  for(const e of list) for(const id of (e.photos||[])) if(photos[id]) out[id] = photos[id];
  return out;
}
/* 写真はブラウザの大きい保存場所（IndexedDB）へ。localStorage には入りきらない */
let photoSaveTimer = null;
function savePhotos(){
  clearTimeout(photoSaveTimer);
  photoSaveTimer = setTimeout(() => { idbSet('photos-' + BOOK, usedPhotos()).catch(()=>{}); }, 300);
}
async function loadPhotos(){
  try {
    const p = await idbGet('photos-' + BOOK);
    if(p && typeof p === 'object'){
      let added = false;
      for(const k in p) if(!photos[k]){ photos[k] = p[k]; added = true; }
      if(added){ renderList(); if(currentId) renderPhotos(); }
    }
  } catch(e){}
}

/* ---------- このHTMLファイルへの上書き ---------- */
const canBind = 'showSaveFilePicker' in window;
let fileHandle = null;
let granted = false;
let writeChain = Promise.resolve();

function serialize(state, book = BOOK){
  const json = JSON.stringify({book, savedAt:state.savedAt, entries:state.entries,
    deleted: state.deleted || [], photos: state.photos || usedPhotos(state.entries)}).replace(/</g, '\\u003c');
  return PRISTINE.replace(
    /(<script type="application\/json" id="diary-data">)[\s\S]*?(<\/script>)/,
    (_, a, b) => a + json + b);
}
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('diary-file', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function idbSet(k, v){
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k);
    t.oncomplete = res; t.onerror = () => rej(t.error);
  });
}
function bindUI(msg){
  const btn = $('bindBtn');
  if(!canBind){
    btn.textContent = '綴じて保存';
    $('bindStatus').textContent = msg || 'このブラウザは開いているファイルへの上書きに対応していない。「綴じて保存」で中身入りの diary.html を保存し直して。';
    return;
  }
  if(fileHandle && granted){
    btn.textContent = '綴じ済み';
    $('bindStatus').textContent = msg || `書くたびに ${fileHandle.name} へ上書き保存中`;
  } else if(fileHandle){
    btn.textContent = '綴じ直す';
    $('bindStatus').textContent = msg || `開き直したので上書きの許可が要る（${fileHandle.name}）`;
  } else {
    btn.textContent = 'このファイルに綴じる';
    $('bindStatus').textContent = msg || 'まだ綴じていない。押して、今開いているこの diary.html を選ぶ';
  }
}
async function initBind(){
  if(canBind){
    try {
      fileHandle = await idbGet('handle-' + BOOK) || null;
      if(fileHandle) granted = (await fileHandle.queryPermission({mode:'readwrite'})) === 'granted';
    } catch(e){ fileHandle = null; }
    if(fileHandle && granted) writeFile({savedAt:Date.now(), entries, deleted:[...torn]});
  }
  bindUI();
}
async function bindClick(){
  if(!canBind){ downloadSelf(); return; }
  try {
    if(fileHandle && !granted){
      granted = (await fileHandle.requestPermission({mode:'readwrite'})) === 'granted';
    } else if(!fileHandle){
      fileHandle = await window.showSaveFilePicker({
        suggestedName:'diary.html',
        types:[{description:'HTML', accept:{'text/html':['.html']}}]
      });
      granted = true;
      try { await idbSet('handle-' + BOOK, fileHandle); } catch(e){}
    }
    if(granted) writeFile({savedAt:Date.now(), entries, deleted:[...torn]});
    bindUI();
  } catch(e){
    if(e.name !== 'AbortError') bindUI('綴じられなかった：' + e.message);
  }
}
function writeFile(state){
  if(!fileHandle || !granted) return;
  writeChain = writeChain.then(async () => {
    try {
      const w = await fileHandle.createWritable();
      await w.write(serialize(state));
      await w.close();
    } catch(e){
      granted = false;
      bindUI('上書きできなかった。押して綴じ直して');
    }
  });
}
/* まっさらな日記帳を作る。押すたびに新しい番号がつくので、他の日記帳と保存場所が混ざらない */
function newBookId(){
  const a = new Uint8Array(10);
  crypto.getRandomValues(a);
  return [...a].map(n => n.toString(16).padStart(2,'0')).join('');
}
function makeBlankBook(){
  const html = serialize({savedAt:0, entries:[]}, newBookId());
  download(new Blob([html], {type:'text/html'}), '日記帳.html');
}
/* ---------- 更新 ---------- */
const UPDATE_PAGE = 'https://h2yhtzkk8y-hash.github.io/diary/';
const UPDATE_URL = UPDATE_PAGE + 'latest.html';
const HOSTED = location.hostname === 'h2yhtzkk8y-hash.github.io';
const DATA_TAG = '<script type="application/json" id="diary-data">';
async function fetchLatest(){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(UPDATE_URL + '?t=' + Date.now(), {cache:'no-store', signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    const m = text.match(/const DIARY_VERSION = (\d+)/);
    if(!m || text.indexOf(DATA_TAG) < 0) throw new Error('not a diary');
    return {text, ver:+m[1]};
  } finally { clearTimeout(tm); }
}
/* 取ってきた最新版に、この日記帳の中身（番号・頁・破いた印・写真）を入れる */
function fillTemplate(text){
  const json = JSON.stringify({book:BOOK, savedAt:Date.now(), entries, deleted:[...torn], photos:usedPhotos()})
    .replace(/</g, '\\u003c');
  const i = text.indexOf(DATA_TAG), j = text.indexOf('</' + 'script>', i);
  return text.slice(0, i + DATA_TAG.length) + json + text.slice(j);
}
/* 共有シートは「押した直後」でないと出せない。だから最新版は先に取ってきておき、
   押した瞬間に手元のものを渡す（押してから取りに行くと、待つ間に共有シートが出せなくなる） */
let latestCache = null;
function saveUpdate(latest){
  flushSave();
  // 名前に版を入れる。ダウンロードで「diary 2」のように勝手に名前を変えられても、どれが最新か一目でわかる
  download(new Blob([fillTemplate(latest.text)], {type:'text/html'}), `日記帳（第${kan(latest.ver)}版）.html`);
  $('updBtn').textContent = '更新を確かめる';
}
function checkUpdate(manual){
  if(HOSTED) return;
  if(manual && latestCache && latestCache.ver > DIARY_VERSION){ saveUpdate(latestCache); return; }
  fetchLatest().then(latest => {
    if(latest.ver <= DIARY_VERSION){
      latestCache = null;
      if(manual) alert(`これが最新（第${kan(DIARY_VERSION)}版）`);
      return;
    }
    latestCache = latest;
    $('updBtn').textContent = `新しい版がある（第${kan(latest.ver)}版）押して保存`;
    if(manual) alert(`第${kan(latest.ver)}版がある。もう一度押すと保存できる`);
  }).catch(() => {
    if(manual) alert('最新版を取りに行けなかった。電波のいい所で、もう一度押して');
  });
}
/* 配布所として開かれたときは、日記は書かせず、新しい日記帳を作る入り口だけ出す */
function showDistribution(){
  $('trace').hidden = true; $('traceBtn').hidden = true; $('tocBtn').hidden = true;
  document.querySelector('.foot').hidden = true;
  $('list').className = '';
  $('list').innerHTML = `<div class="dist">
    <p>ここは日記帳の配布所。<br>下を押して自分の日記帳を作り、保存したファイルを開いて使って。<br>ここで書いたものは保存されない。</p>
    <button onclick="makeBlankBook()">新しい日記帳を作る</button>
    <p style="margin-top:28px" id="distVer"></p>
  </div>`;
  $('distVer').textContent = $('verLine').textContent;
}
function downloadSelf(){
  const [, m, d] = today().split('-').map(Number);
  download(new Blob([serialize({savedAt:Date.now(), entries, deleted:[...torn]})], {type:'text/html'}), `日記帳（${m}月${d}日 綴じ）.html`);
}

/* ---------- 日付まわり ---------- */
function today(){
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function bornAt(e){ return e.created || e.updated || 0; }
function sorted(){
  // 日付の新しい順。同じ日の中は書き始めた順（新しく書き始めた方が先）で、直しても動かない
  return [...entries].sort((a,b)=> b.date.localeCompare(a.date) || bornAt(b) - bornAt(a));
}
const KANJI = ['〇','一','二','三','四','五','六','七','八','九'];
function kan(n){
  if(n<10) return KANJI[n];
  if(n<20) return '十' + (n%10 ? KANJI[n%10] : '');
  return KANJI[Math.floor(n/10)] + '十' + (n%10 ? KANJI[n%10] : '');
}
function wd(s){ const [y,m,d]=s.split('-').map(Number); return '日月火水木金土'[new Date(y,m-1,d).getDay()]; }
function fmtShort(s){ const [,m,d]=s.split('-').map(Number); return `${kan(m)}月${kan(d)}日 ${wd(s)}`; }
function fmtYMD(s){ const [y,m,d]=s.split('-').map(Number); return `${y}年${m}月${d}日`; }
function fmtLong(s){ const [y,m,d]=s.split('-').map(Number); return `${y}年${m}月${d}日（${wd(s)}）`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('show', v.id===id));
  window.scrollTo(0,0);
}

/* ---------- 頁を辿る ---------- */
function uniq(a){ return [...new Set(a)]; }
function fillSelect(el, values, fmt){
  const cur = el.value;
  el.innerHTML = '<option value="">—</option>' +
    values.map(v=>`<option value="${v}">${fmt(v)}</option>`).join('');
  el.value = values.includes(cur) ? cur : '';
}
function populateTrace(){
  const dates = entries.map(e=>e.date);
  fillSelect($('fy'), uniq(dates.map(d=>d.slice(0,4))).sort().reverse(), v=>v);
  const y = $('fy').value;
  fillSelect($('fm'), y ? uniq(dates.filter(d=>d.startsWith(y)).map(d=>d.slice(5,7))).sort() : [], v=>+v);
  const m = $('fm').value;
  fillSelect($('fd'), m ? uniq(dates.filter(d=>d.startsWith(`${y}-${m}`)).map(d=>d.slice(8,10))).sort() : [], v=>+v);
  $('fm').disabled = !y;
  $('fd').disabled = !m;
}
function onTrace(level){
  if(level==='y'){ $('fm').value=''; $('fd').value=''; }
  if(level==='m'){ $('fd').value=''; }
  renderList();
}
function clearTrace(){
  $('fy').value=''; $('fm').value=''; $('fd').value=''; $('q').value='';
  renderList();
}
function toggleTrace(){
  const p = $('trace'), open = p.hidden;
  p.hidden = !open;
  $('traceBtn').setAttribute('aria-expanded', open);
  if(!open) clearTrace();
}
function toggleToc(){
  view = view === 'toc' ? 'pages' : 'toc';
  try { localStorage.setItem(VIEWKEY, view); } catch(e){}
  renderList();
}

/* ---------- 一覧の描画 ---------- */
function renderList(){
  populateTrace();
  $('tocBtn').setAttribute('aria-pressed', view === 'toc');
  const q = $('q').value.trim().toLowerCase();
  const prefix = [$('fy').value, $('fm').value, $('fd').value].filter(Boolean).join('-');
  const filtering = q || prefix;
  const list = $('list');
  shown = sorted().filter(e =>
    (!prefix || e.date.startsWith(prefix)) &&
    (!q || ((e.title||'') + (e.body||'')).toLowerCase().includes(q)));

  if(view === 'toc'){
    list.className = 'toc';
    const rows = shown.map(e => `
      <div class="row ${selected.has(e.id)?'sel':''}" tabindex="0" role="button"
        onclick="pageClick('${e.id}')" onkeydown="if(event.key==='Enter')pageClick('${e.id}')">
        <span class="rt">${esc(e.title || '無題')}</span><span class="lead"></span>
        <span class="rd">${fmtYMD(e.date)}</span>
      </div>`).join('');
    list.innerHTML = '<h2>目次</h2>' +
      (rows || `<div class="none">${filtering ? '該当する頁がない' : 'まだ何も書いていない'}</div>`);
  } else {
    list.className = '';
    const blank = `<div class="spread">
      <div class="page blank" tabindex="0" role="button" aria-label="手で書く白紙"
        onclick="newEntry('ink')" onkeydown="if(event.key==='Enter')newEntry('ink')"></div>
      <div class="page blank lined" tabindex="0" role="button" aria-label="文字で書く白紙"
        onclick="newEntry('text')" onkeydown="if(event.key==='Enter')newEntry('text')"></div>
    </div>`;
    const card = e => `
      <div class="page ${selected.has(e.id)?'sel':''}" tabindex="0" role="button"
        onclick="pageClick('${e.id}')" onkeydown="if(event.key==='Enter')pageClick('${e.id}')">
        ${(e.photos||[]).length && photos[e.photos[0]] ? `<img class="pthumb" alt="" src="${photos[e.photos[0]].src}">` : ''}
        ${e.type === 'ink'
          ? `<div class="hd">${fmtShort(e.date)}${e.title ? `<span class="t">${esc(e.title)}</span>` : ''}</div>
             <div class="inkthumb">${inkSVG(e.strokes)}</div>`
          : `<div class="hd">${fmtShort(e.date)}</div>
             <div class="cols">
               <div class="ttl">${esc(e.title || '無題')}</div>
               <div class="ex">${esc((e.body||'').slice(0,160))}</div>
             </div>`}
      </div>`;
    const pages = shown.map(card).join('');
    const grid = `<div class="pages">${pages}</div>`;
    list.innerHTML = (filtering || selecting)
      ? (pages ? grid : '<div class="none">該当する頁がない</div>')
      : blank + groupedHTML(shown, card);
  }
  $('selCount').textContent = `${selected.size}頁`;
}
/* ---------- 月ごと・年ごとのまとめ ---------- */
/* 今年の分は月ごとに区切る。去年より前は、年ごとに一冊にまとめて閉じておく */
const OPENKEY = 'diary-open-' + BOOK;
let openState = {};
try { openState = JSON.parse(localStorage.getItem(OPENKEY)) || {}; } catch(e){}
function kanYear(y){ return String(y).split('').map(c => KANJI[+c]).join(''); }
function isOpen(key, byDefault){ return key in openState ? openState[key] : byDefault; }
function toggleGroup(key, byDefault){
  openState[key] = !isOpen(key, byDefault);
  try { localStorage.setItem(OPENKEY, JSON.stringify(openState)); } catch(e){}
  renderList();
}
function groupHead(key, label, count, open, byDefault, cls){
  return `<button class="ghead ${cls||''}" aria-expanded="${open}" onclick="toggleGroup('${key}', ${byDefault})">
    <span class="gl">${label}</span><span class="arrow" aria-hidden="true"></span></button>`;
}
function groupedHTML(list, card){
  if(!list.length) return '';
  const thisYear = today().slice(0,4);
  const newestMonth = list[0].date.slice(0,7);   // 一番新しい頁がある月だけ、最初から開いておく
  const byMonth = new Map();
  for(const e of list){ const k = e.date.slice(0,7); (byMonth.get(k) || byMonth.set(k, []).get(k)).push(e); }
  const monthHTML = (k, es) => {
    const def = k === newestMonth, open = isOpen('m' + k, def);
    return `<section class="group month ${open?'open':''}">
      ${groupHead('m' + k, `${kan(+k.slice(5,7))}月`, es.length, open, def)}
      ${open ? `<div class="pages">${es.map(card).join('')}</div>` : ''}
    </section>`;
  };
  let html = '', yearOpen = null;
  const months = [...byMonth.keys()];
  const years = [...new Set(months.map(k => k.slice(0,4)))];
  for(const y of years){
    const ms = months.filter(k => k.startsWith(y));
    if(y >= thisYear){
      html += ms.map(k => monthHTML(k, byMonth.get(k))).join('');
    } else {
      const count = ms.reduce((n,k) => n + byMonth.get(k).length, 0);
      const open = isOpen('y' + y, false);
      html += `<section class="group year ${open?'open':''}">
        ${groupHead('y' + y, `${kanYear(y)}年`, count, open, false, 'yh')}
        ${open ? `<div class="ybody">${ms.map(k => monthHTML(k, byMonth.get(k))).join('')}</div>` : ''}
      </section>`;
    }
  }
  return `<div class="groups">${html}</div>`;
}
function pageClick(id){
  if(selecting){
    selected.has(id) ? selected.delete(id) : selected.add(id);
    renderList();
  } else openEntry(id);
}

/* ---------- 書く ---------- */
function openEntry(id){
  const e = entries.find(x=>x.id===id); if(!e) return;
  currentId = id;
  $('date').value = e.date;
  $('title').value = e.title;
  $('body').value = e.body || '';
  const ink = e.type === 'ink';
  $('editView').classList.toggle('is-ink', ink);
  updateMeta(e);
  setStatus('');
  show('editView');
  renderPhotos();
  if(!ink) growBody();
  if(ink){ undoStack = []; fitInk(); }
}
function renderPhotos(){
  const e = entries.find(x=>x.id===currentId);
  $('photos').innerHTML = (e && e.photos || []).filter(id => photos[id])
    .map(id => `<img class="photo" alt="写真" src="${photos[id].src}" onclick="openPhoto('${id}')">`).join('');
}
async function shrinkPhoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1400;
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
    return {src: c.toDataURL('image/jpeg', 0.8), w, h};
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(input){
  const e = entries.find(x=>x.id===currentId); if(!e) return;
  const files = [...input.files]; input.value = '';
  if(!files.length) return;
  setStatus('写真を入れている…');
  let ok = 0;
  for(const f of files){
    try {
      const p = await shrinkPhoto(f);
      const id = 'p' + uid();
      photos[id] = p;
      (e.photos = e.photos || []).push(id);
      ok++;
    } catch(err){}
  }
  if(!ok){ setStatus('写真を読めなかった'); return; }
  e.updated = Date.now();
  renderPhotos(); persist();
}
let viewingPhoto = null;
function openPhoto(id){
  viewingPhoto = id; $('lbImg').src = photos[id].src; $('lightbox').hidden = false;
}
function closePhoto(){ $('lightbox').hidden = true; viewingPhoto = null; }
function removePhoto(){
  const e = entries.find(x=>x.id===currentId);
  if(!e || !viewingPhoto || !confirm('この写真を外す？')) return;
  e.photos = (e.photos||[]).filter(id => id !== viewingPhoto);
  e.updated = Date.now();
  closePhoto(); renderPhotos(); persist();
}
function growBody(){
  const t = $('body');
  t.style.height = 'auto';
  t.style.height = Math.max(t.scrollHeight, window.innerHeight * 0.5) + 'px';
}
window.addEventListener('resize', () => { if(currentId) growBody(); });
function updateMeta(e){
  $('when').textContent = fmtLong(e.date);
  $('meta').textContent = e.type === 'ink' ? '' : `${(e.body||'').replace(/\s/g,'').length}字`;
}
function newEntry(type){
  const e = {id:uid(), type: type === 'ink' ? 'ink' : 'text', date:today(), title:'', body:'',
             created:Date.now(), updated:Date.now()};
  if(e.type === 'ink') e.strokes = [];
  entries.push(e);
  openEntry(e.id);
  if(e.type === 'text') $('body').focus();
}
/* 日付は、自分で日付欄を変えたときだけ変わる。本文を直しても書いた日のまま */
function onDateChange(){
  const e = entries.find(x=>x.id===currentId); if(!e) return;
  const v = $('date').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ $('date').value = e.date; return; }
  if(v === e.date) return;
  e.date = v; e.updated = Date.now();
  updateMeta(e); setStatus('…');
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 600);
}
function onEdit(){
  const e = entries.find(x=>x.id===currentId); if(!e) return;
  e.title = $('title').value;
  e.body = $('body').value;
  e.updated = Date.now();
  if(e.type !== 'ink') growBody();
  updateMeta(e);
  setStatus('…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 600);
}
function backToList(){
  clearTimeout(saveTimer);
  drawing = null;
  try {
    entries = entries.filter(e => e.id!==currentId || hasContent(e));
    persist();
  } catch(e){ console.error(e); }
  currentId = null;
  $('editView').classList.remove('is-ink');
  try { renderList(); } catch(e){ console.error(e); }
  show('listView');
}
function deleteEntry(){
  if(!currentId || !confirm('この頁を破く？（元に戻せない）')) return;
  torn.add(currentId);
  entries = entries.filter(x=>x.id!==currentId);
  currentId = null;
  persist();
  renderList();
  show('listView');
}

/* ---------- 手で書く ---------- */
const INK_W = 900, INK_H = 1200;
let tool = 'pen', bold = false, drawing = null, penSeen = false, undoStack = [];
let strokeAt = 0, strokeEndAt = 0;
/* 書いている最中のタップと、ペンで書いた直後に手のひらが触れたタップだけ捨てる。
   ボタン自体は無効にしないので、固まって押せなくなることはない */
function swallowBarTap(ev){
  const now = performance.now();
  const busy = drawing && now - strokeAt < 8000;   // 8秒以上続く線は取りこぼしとみなす
  const palm = penSeen && ev.pointerType === 'touch' && now - strokeEndAt < 350;
  if(busy || palm){ ev.stopPropagation(); ev.preventDefault(); }
}
document.addEventListener('selectstart', ev => { if(drawing) ev.preventDefault(); });
function curEntry(){ return entries.find(x=>x.id===currentId); }
function inkWidth(base, p){ return base * (0.35 + 1.3 * p); }
function drawStrokes(ctx, strokes, k){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#22252a';
  for(const s of strokes){
    const pts = s.p;
    if(pts.length === 1){
      ctx.beginPath(); ctx.fillStyle = '#22252a';
      ctx.arc(pts[0][0]*k, pts[0][1]*k, inkWidth(s.w, pts[0][2])*k/2, 0, Math.PI*2); ctx.fill();
      continue;
    }
    for(let i=1;i<pts.length;i++){
      const a = pts[i-1], b = pts[i], c = pts[i+1];
      ctx.beginPath();
      ctx.lineWidth = inkWidth(s.w, (a[2]+b[2])/2) * k;
      ctx.moveTo(i===1 ? a[0]*k : (pts[i-2][0]+a[0])/2*k, i===1 ? a[1]*k : (pts[i-2][1]+a[1])/2*k);
      ctx.quadraticCurveTo(a[0]*k, a[1]*k, (a[0]+b[0])/2*k, (a[1]+b[1])/2*k);
      if(!c) ctx.lineTo(b[0]*k, b[1]*k);
      ctx.stroke();
    }
  }
}
function fitInk(){
  const c = $('ink'), r = c.getBoundingClientRect();
  if(!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  redrawInk();
}
function redrawInk(){
  const c = $('ink'), ctx = c.getContext('2d'), e = curEntry();
  ctx.clearRect(0, 0, c.width, c.height);
  if(!e || e.type !== 'ink') return;
  const k = c.width / INK_W;
  drawStrokes(ctx, e.strokes, k);
  if(drawing) drawStrokes(ctx, [drawing], k);
}
function inkPoint(ev, prev){
  const r = $('ink').getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * INK_W, y = (ev.clientY - r.top) / r.height * INK_H;
  let p;
  if(ev.pointerType === 'pen' && ev.pressure > 0) p = ev.pressure;
  else {
    // 指やマウスは速さで太さを変える：ゆっくりは太く、速いと細く
    const v = prev ? Math.hypot(x-prev[0], y-prev[1]) / Math.max(1, ev.timeStamp - prev[3]) : 0;
    const target = Math.max(0.25, 0.85 - v * 0.35);
    p = prev ? prev[2] * 0.6 + target * 0.4 : 0.55;
  }
  return [Math.round(x*10)/10, Math.round(y*10)/10, Math.round(p*100)/100, ev.timeStamp];
}
function pushUndo(){
  const e = curEntry(); undoStack.push(JSON.stringify(e.strokes));
  if(undoStack.length > 60) undoStack.shift();
}
function eraseAt(x, y){
  const e = curEntry(), r = 22;
  const before = e.strokes.length;
  e.strokes = e.strokes.filter(s => !s.p.some(q => Math.hypot(q[0]-x, q[1]-y) < r + s.w));
  if(e.strokes.length !== before) redrawInk();
}
function inkChanged(){
  const e = curEntry(); e.updated = Date.now();
  setStatus('…'); clearTimeout(saveTimer); saveTimer = setTimeout(persist, 600);
}
function setupInk(){
  const c = $('ink');
  c.addEventListener('pointerdown', ev => {
    if(ev.pointerType === 'pen') penSeen = true;
    if(ev.pointerType === 'touch' && penSeen) return;   // ペンを使ったら手のひらは無視
    if(ev.button > 0) return;
    ev.preventDefault();
    try { c.setPointerCapture(ev.pointerId); } catch(e){}
    strokeAt = performance.now();
    try { window.getSelection().removeAllRanges(); } catch(e){}
    pushUndo();
    const pt = inkPoint(ev, null);
    if(tool === 'erase'){ drawing = {erase:true, id:ev.pointerId}; eraseAt(pt[0], pt[1]); return; }
    drawing = {w: bold ? 6.5 : 3.2, p:[pt], id:ev.pointerId};
    redrawInk();
  });
  c.addEventListener('pointermove', ev => {
    if(!drawing || ev.pointerId !== drawing.id) return;
    ev.preventDefault();
    const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
    for(const e2 of (evs.length ? evs : [ev])){
      if(drawing.erase){ const pt = inkPoint(e2, null); eraseAt(pt[0], pt[1]); continue; }
      const last = drawing.p[drawing.p.length-1];
      const pt = inkPoint(e2, last);
      if(Math.hypot(pt[0]-last[0], pt[1]-last[1]) < 1.5) continue;
      drawing.p.push(pt);
    }
    if(!drawing.erase) redrawInk();
  });
  const end = ev => {
    if(!drawing || ev.pointerId !== drawing.id) return;
    const e = curEntry();
    if(!drawing.erase){
      const s = {w: drawing.w, p: drawing.p.map(q => [q[0], q[1], q[2]])};
      if(s.p.length > 1){   // 書き終わりは少し抜く
        const n = s.p.length, m = Math.min(4, n-1);
        for(let i=0;i<m;i++){ const q = s.p[n-1-i]; q[2] = Math.round(q[2] * (0.45 + 0.55*i/m) * 100)/100; }
      }
      e.strokes.push(s);
    }
    drawing = null; strokeEndAt = performance.now(); redrawInk(); inkChanged();
  };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  c.addEventListener('lostpointercapture', end);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  document.querySelector('#editView .bar').addEventListener('click', swallowBarTap, true);
  window.addEventListener('resize', () => { if(curEntry() && curEntry().type === 'ink') fitInk(); });
}
function setTool(t){
  tool = t;
  $('tPen').setAttribute('aria-pressed', t === 'pen');
  $('tErase').setAttribute('aria-pressed', t === 'erase');
}
function toggleBold(){ bold = !bold; $('tBold').setAttribute('aria-pressed', bold); setTool('pen'); }
function undoInk(){
  const e = curEntry(); if(!e || !undoStack.length) return;
  e.strokes = JSON.parse(undoStack.pop()); redrawInk(); inkChanged();
}
/* 縮小図用のSVG（太さは平均で） */
function inkSVG(strokes){
  const d = (strokes||[]).map(s => {
    const pts = s.p.length === 1 ? [s.p[0], [s.p[0][0]+0.1, s.p[0][1]]] : s.p;
    const avg = pts.reduce((a,q)=>a+q[2],0) / pts.length;
    return `<path stroke-width="${(inkWidth(s.w, avg)*1.6).toFixed(1)}" d="M${pts.map(q=>q[0]+' '+q[1]).join(' L')}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${INK_W} ${INK_H}" preserveAspectRatio="xMidYMin meet">${d}</svg>`;
}
function inkPNG(strokes){
  return new Promise(res => {
    const c = document.createElement('canvas'); c.width = INK_W; c.height = INK_H;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,INK_W,INK_H);
    drawStrokes(ctx, strokes || [], 1);
    c.toBlob(async b => res(new Uint8Array(await b.arrayBuffer())), 'image/png');
  });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c^buf[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
/* 無圧縮ZIP（docxの入れ物） */
function makeZip(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for(const f of files){
    const name = enc.encode(f.name), data = f.bytes || enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true);
    h.setUint16(8,0,true); h.setUint16(10,0,true); h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true); h.setUint16(28,0,true);
    chunks.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint16(10,0,true); c.setUint16(12,0,true); c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true); c.setUint16(30,0,true); c.setUint16(32,0,true);
    c.setUint16(34,0,true); c.setUint16(36,0,true); c.setUint32(38,0,true); c.setUint32(42,offset,true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s,a)=>s+a.length,0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true); e.setUint32(16,offset,true);
  return new Blob([...chunks, ...central, new Uint8Array(e.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function x(s){
  return String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function run(text, o={}){
  const sz = o.sz || 21;
  return `<w:r><w:rPr><w:rFonts w:ascii="Yu Mincho" w:hAnsi="Yu Mincho" w:eastAsia="Yu Mincho"/>`
    + (o.b ? '<w:b/>' : '') + (o.color ? `<w:color w:val="${o.color}"/>` : '')
    + `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${x(text)}</w:t></w:r>`;
}
function para(runs, after=0, line=0){
  const sp = `<w:spacing w:after="${after}"${line?` w:line="${line}" w:lineRule="auto"`:''}/>`;
  return `<w:p><w:pPr>${sp}</w:pPr>${runs}</w:p>`;
}
function inkDrawing(n, cx = 4680000, cy = 6240000){
  return `<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">`
    + `<wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="手書き${n}"/>`
    + `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">`
    + `<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">`
    + `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">`
    + `<pic:nvPicPr><pic:cNvPr id="${n}" name="image${n}"/><pic:cNvPicPr/></pic:nvPicPr>`
    + `<pic:blipFill><a:blip r:embed="rImg${n}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
    + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>`
    + `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}
function dataUrlBytes(u){
  const b = atob(u.slice(u.indexOf(',') + 1)), a = new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i);
  return a;
}
function buildDocx(list, images={}, pics={}){
  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
    + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
    + ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"';
  const media = [];
  const body = [...list].sort((a,b)=>a.date.localeCompare(b.date) || bornAt(a) - bornAt(b)).map((e,i) => {
    let main;
    if(e.type === 'ink' && images[e.id]){
      const n = media.length + 1; media.push({bytes:images[e.id], ext:'png'});
      main = inkDrawing(n);
    } else main = (e.body||'').split('\n').map(l => para(run(l), 0, 360)).join('');
    for(const id of (e.photos||[])){
      const ph = pics[id]; if(!ph) continue;
      const n = media.length + 1; media.push({bytes:dataUrlBytes(ph.src), ext:'jpeg'});
      const maxW = 4680000, maxH = 5400000;
      const k = Math.min(maxW / ph.w, maxH / ph.h);
      main += para('', 120) + inkDrawing(n, Math.round(ph.w * k), Math.round(ph.h * k));
    }
    return (i ? '<w:p><w:r><w:br w:type="page"/></w:r></w:p>' : '')
      + para(run(e.title || '無題', {b:true, sz:32}), 120)
      + para(run(fmtLong(e.date), {color:'777777', sz:20}), 360)
      + main;
  }).join('');
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<w:document ${NS}><w:body>${body}`
    + `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>`
    + `<w:pgMar w:top="1701" w:right="1701" w:bottom="1701" w:left="1701" w:header="851" w:footer="992" w:gutter="0"/>`
    + `</w:sectPr></w:body></w:document>`;
  const types = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
    + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
    + `<Default Extension="xml" ContentType="application/xml"/>`
    + `<Default Extension="png" ContentType="image/png"/>`
    + `<Default Extension="jpeg" ContentType="image/jpeg"/>`
    + `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>`
    + `</Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
    + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>`
    + `</Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
    + media.map((m,i) => `<Relationship Id="rImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.${m.ext}"/>`).join('')
    + `</Relationships>`;
  return makeZip([
    {name:'[Content_Types].xml', text:types},
    {name:'_rels/.rels', text:rels},
    {name:'word/document.xml', text:doc},
    {name:'word/_rels/document.xml.rels', text:docRels},
    ...media.map((m,i) => ({name:`word/media/image${i+1}.${m.ext}`, bytes:m.bytes})),
  ]);
}
async function exportDocx(list){
  const dates = list.map(e=>e.date).sort();
  const name = dates[0] === dates[dates.length-1]
    ? `日記-${dates[0]}.docx` : `日記-${dates[0]}_${dates[dates.length-1]}.docx`;
  const images = {};
  for(const e of list) if(e.type === 'ink') images[e.id] = await inkPNG(e.strokes);
  download(buildDocx(list, images, usedPhotos(list)), name);
}

/* ---------- 控え（JSON） ---------- */
/* スマホでは共有シート（「ファイルに保存」など）で渡す。使えなければふつうに保存 */
async function download(blob, name){
  const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  if(touch && navigator.share && navigator.canShare){
    try {
      const f = new File([blob], name, {type: blob.type || 'application/octet-stream'});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return; }
    } catch(e){ if(e && e.name === 'AbortError') return; }
  }
  plainDownload(blob, name);
}
function plainDownload(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportData(){
  download(new Blob([JSON.stringify({entries, photos:usedPhotos()}, null, 1)], {type:'application/json'}), `diary-${today()}.json`);
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const raw = JSON.parse(r.result);
      const data = readState(raw);
      if(!data) throw 0;
      if(raw.photos && typeof raw.photos === 'object') for(const k in raw.photos) if(!photos[k]) photos[k] = raw.photos[k];
      const ids = new Set(entries.map(e=>e.id));
      let n = 0;
      data.entries.forEach(e => { if(e && e.id && !ids.has(e.id)){ torn.delete(e.id); entries.push(e); n++; } });
      persist(); renderList();
      alert(`${n}件読み込んだ`);
    }catch(e){ alert('読み込めないファイル'); }
    input.value = '';
  };
  r.readAsText(f);
}
